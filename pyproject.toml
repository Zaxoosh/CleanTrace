[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cleantrace"
version = "0.3.0"
description = "Local-first privacy exposure and OSINT self-assessment CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CleanTrace contributors" }]
keywords = ["privacy", "osint", "cli", "local-first", "self-assessment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "platformdirs>=4.2.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "rich>=13.7.0",
  "sqlmodel>=0.0.19",
  "textual>=0.86.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
cleantrace = "cleantrace.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cleantrace"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/cleantrace"]
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
