- name: GitHub
  url: https://github.com
  check_url: https://github.com/{username}
  username_claimed_regex: '<meta property="og:url" content="https://github.com/{username}"'
  username_unclaimed_regex: "Not Found"
  expected_status: [200]
  tags: [dev, professional]
  country: US
  enabled_by_default: true
  confidence_rules: {status_and_pattern: 92}
  notes: Public developer profiles can reveal commit emails, organisations, and linked domains.
- name: GitLab
  url: https://gitlab.com
  check_url: https://gitlab.com/{username}
